# .github/workflows/deploy-ec2.yml
name: Deploy API to EC2

on:
  push:
    branches: [ "develop" ]
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "Dockerfile"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "056445322590"
  ECR_REPO: ecozone-alpha-api
  IMAGE_TAG: ${{ github.sha }}
  SSM_TARGETS: |
    [{"Key":"tag:App","Values":["ecozone-alpha-api"]}]

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read

    steps:
        
      # ────────────────────────
      # 1️.  코드 체크아웃
      # ────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        
          submodules: recursive    

    # ────────────────────────
    #   리포 구조 확인 (디버그)
    # ────────────────────────
      - name: Show repo tree
        run: |
          pwd
          git rev-parse --short HEAD || true
          ls -la
          find . -maxdepth 2 -type d

      # ────────────────────────
      # 2️.  Docker 빌드 환경 준비
      # ────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ────────────────────────
      # 3️.  AWS 자격 증명 설정 (OIDC AssumeRole)
      # ────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-action-deploy
          aws-region: ${{ env.AWS_REGION }}

      # ────────────────────────
      # 4️.  ECR 로그인
      # ────────────────────────
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      # ────────────────────────
      # 5. ECR 리포지토리 없으면 생성
      # ────────────────────────
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPO --region $AWS_REGION || \
          aws ecr create-repository --repository-name $ECR_REPO --region $AWS_REGION

      # ────────────────────────
      # 6.  Docker 이미지 빌드 & ECR 푸시
      # ────────────────────────
      - name: Build & Push image
        run: |
          REPO="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"
          docker build -t "${REPO}:${IMAGE_TAG}" -t "${REPO}:latest" .
          docker push "${REPO}:${IMAGE_TAG}"
          docker push "${REPO}:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read

    steps:
      # ────────────────────────
      # 6️.  AWS 자격 증명 설정 (OIDC AssumeRole)
      # ────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-action-deploy
          aws-region: ${{ env.AWS_REGION }}

      # ────────────────────────
      # 7.  테스트로 인스턴스 ID로 직접 보내기
      # ────────────────────────
      - name : send Test to Instance ID
        run: |
          aws ssm send-command \
          --region ap-northeast-2 \
          --document-name "AWS-RunShellScript" \
          --instance-ids i-02e6ebdf2218be79b \
          --parameters commands='["echo hello from ssm","uname -a"]'

      # ────────────────────────
      # 8.  EC2 대상에 SSM 명령 전송 
      # ────────────────────────
      - name: Send deploy command via SSM (bootstrap + compose + logs)
        id: ssm
        run: |
          set -e
          ACCOUNT="${AWS_ACCOUNT_ID}"
          REGION="${AWS_REGION}"
          REPO="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${ECR_REPO}"
          TAG="${IMAGE_TAG}"

          if [ -n "${{ secrets.APPLICATION_PROPERTIES }}" ]; then
            APP_CONF=$(echo "${{ secrets.APPLICATION_PROPERTIES }}" | base64 -w 0)
          else
            APP_CONF="$(echo "" | base64 -w 0)"
          fi

          CMDS=(
            "bash -lc 'set -eux'"
            "bash -lc 'command -v docker >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y docker.io docker-compose-plugin; }'"
            "bash -lc 'systemctl list-units --type=service | grep -q docker.service && sudo systemctl enable --now docker || sudo snap start --enable docker || true'"
            "bash -lc 'aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com'"
            "bash -lc 'sudo mkdir -p /srv/app/logs && cd /srv/app'"
            # compose.yml 생성
            "bash -lc 'printf \"%s\n\" \
              \"services:\" \
              \"  api:\" \
              \"    image: ${REPO}:${TAG}\" \
              \"    container_name: ecozone-api\" \
              \"    restart: always\" \
              \"    ports:\" \
              \"      - 80:8080\" \
              \"    volumes:\" \
              \"      - /srv/app/application.yml:/app/config/application.yml:ro\" \
              > /srv/app/compose.yml'"
            # application.yml 저장
            "bash -lc 'echo ${APP_CONF} | base64 -d > /srv/app/application.yml'"
            # 배포
            "bash -lc 'cd /srv/app && docker compose -f compose.yml pull'"
            "bash -lc 'cd /srv/app && docker compose -f compose.yml up -d'"
            # 로그 파일 저장(날짜 변수 사용)
            "bash -lc 'TS=$(date +%Y%m%d_%H%M%S); cd /srv/app; docker compose -f compose.yml logs --no-color > logs/compose_${TS}.log 2>&1 || true'"
            "bash -lc 'TS=$(date +%Y%m%d_%H%M%S); docker logs ecozone-api --since 10m > /srv/app/logs/api_${TS}.log 2>&1 || true'"
            # 상태 확인
            "bash -lc 'docker ps'"
            "bash -lc 'ls -l /srv/app /srv/app/logs || true'"
          )

          printf '%s\0' "${CMDS[@]}" | jq -Rs 'split("\u0000")[:-1] | {commands: .}' > commands.json

          aws ssm send-command \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --instance-ids i-02e6ebdf2218be79b \
            --parameters file://commands.json \
            --timeout-seconds 1800 \
            --output json > ssm.json

          cat ssm.json
          echo "command_id=$(jq -r '.Command.CommandId' ssm.json)" >> $GITHUB_OUTPUT

      # ────────────────────────
      # 9.  SSM 실행 로그 가져오기(성공/실패 확인)
      # ────────────────────────
      - name: Fetch SSM execution logs
        run: |
          CMD_ID="${{ steps.ssm.outputs.command_id }}"
          aws ssm list-command-invocations \
            --region ${{ env.AWS_REGION }} \
            --command-id "$CMD_ID" \
            --details \
            --query 'CommandInvocations[0].CommandPlugins[].{Name:Name,Status:Status,Output:Output}'

