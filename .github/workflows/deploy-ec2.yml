# .github/workflows/deploy-ec2.yml
name: Deploy API to EC2

on:
  push:
    branches: ["develop"]
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "Dockerfile"
      - "compose.yml"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "056445322590"
  ECR_REPO: ecozone-alpha-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read

    steps:
      # ────────────────────────
      # 1️.  코드 체크아웃
      # ────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ────────────────────────
      # 2️.  Docker 빌드 준비
      # ────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ────────────────────────
      # 3️.  AWS 자격 증명 (OIDC)
      # ────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-action-deploy
          aws-region: ${{ env.AWS_REGION }}

      # ────────────────────────
      # 4️.  ECR 로그인
      # ────────────────────────
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ────────────────────────
      # 5.  ECR 리포 없으면 생성
      # ────────────────────────
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO" --region "$AWS_REGION" || \
          aws ecr create-repository --repository-name "$ECR_REPO" --region "$AWS_REGION"

      # ────────────────────────
      # 6.  이미지 빌드 & 푸시
      # ────────────────────────
      - name: Build & Push image
        run: |
          REPO="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"
          docker build -t "${REPO}:${IMAGE_TAG}" -t "${REPO}:latest" .
          docker push "${REPO}:${IMAGE_TAG}"
          docker push "${REPO}:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read

    steps:
      # ────────────────────────
      # 7️.  AWS 자격 증명 (OIDC)
      # ────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-action-deploy
          aws-region: ${{ env.AWS_REGION }}

      # ────────────────────────
      # 8.  배포 (레포의 compose.yml + Secrets/application.yml)
      # ────────────────────────
      - name: Deploy via SSM
        id: ssm
        env:
          ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          REGION:  ${{ env.AWS_REGION }}
          REPO:    ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}
          TAG:     ${{ env.IMAGE_TAG }}
          APP_YML: ${{ secrets.APPLICATION_YML || '' }}
        run: |
          set -euo pipefail

          # 0) compose.yml 존재 확인(레포 루트)
          if [ ! -f compose.yml ]; then
            echo "compose.yml not found at repo root."
            find . -maxdepth 2 -type f -name "compose.yml" -print
            exit 1
          fi

          # 1) compose.yml → base64 (러너에서 읽어 EC2로 전송)
          COMPOSE_B64="$(base64 -w 0 < compose.yml)"

          # 2) application.yml → base64 
          if [ -n "${APP_YML:-}" ]; then
            APP_B64="$(printf '%s' "${APP_YML}" | base64 -w 0)"
          else
            APP_B64=""
          fi

          # 3) SSM용 commands.json 생성
          jq -n --arg ACCOUNT "$ACCOUNT" \
                --arg REGION  "$REGION" \
                --arg REPO    "$REPO" \
                --arg TAG     "$TAG" \
                --arg COMPB64 "$COMPOSE_B64" \
                --arg APPB64  "$APP_B64" '
          {commands: [
            "set -euxo pipefail",

            # Docker/compose 설치
            "command -v docker >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y docker.io docker-compose-plugin; }",

            # 데몬 기동 (systemd or snap)
            "if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files | grep -q ^docker.service; then sudo systemctl enable --now docker; else sudo snap start --enable docker || true; fi",

            # ECR 로그인
            "aws ecr get-login-password --region \($REGION) | docker login --username AWS --password-stdin \($ACCOUNT).dkr.ecr.\($REGION).amazonaws.com",

            # 작업 디렉터리
            "sudo mkdir -p /srv/app/logs && cd /srv/app",

            # 레포의 compose.yml 복원
            "printf %s \"\($COMPB64)\" | base64 -d > /srv/app/compose.yml",

            # application.yml 복원(있으면), 권한 부여
            "printf %s \"\($APPB64)\" | base64 -d > /srv/app/application.yml || true",
            "chmod 644 /srv/app/application.yml || true",

            # 배포
            "docker compose -f /srv/app/compose.yml pull || true",
            "docker compose -f /srv/app/compose.yml up -d",

            # 로그 수집
            "TS=$(date +%Y%m%d_%H%M%S); docker compose -f /srv/app/compose.yml logs --no-color > /srv/app/logs/compose_${TS}.log 2>&1 || true",
            "TS=$(date +%Y%m%d_%H%M%S); docker logs ecozone-api --since 10m > /srv/app/logs/api_${TS}.log 2>&1 || true",

            # 상태 출력
            "docker ps",
            "ls -l /srv/app /srv/app/logs || true"
          ]}' > commands.json

          # 4) SSM 실행
          aws ssm send-command \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --instance-ids i-02e6ebdf2218be79b \
            --parameters file://commands.json \
            --timeout-seconds 1800 \
            --output json > ssm.json

          cat ssm.json
          echo "command_id=$(jq -r '.Command.CommandId' ssm.json)" >> $GITHUB_OUTPUT

      # ────────────────────────
      # 9.  실행 로그 확인
      # ────────────────────────
      - name: Fetch SSM execution logs
        run: |
          CMD_ID="${{ steps.ssm.outputs.command_id }}"
          aws ssm list-command-invocations \
            --region ${{ env.AWS_REGION }} \
            --command-id "$CMD_ID" \
            --details \
            --query 'CommandInvocations[0].CommandPlugins[].{Name:Name,Status:Status,Output:Output}'
