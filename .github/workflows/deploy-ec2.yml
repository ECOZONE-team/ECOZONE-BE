# .github/workflows/deploy-ec2.yml
name: Deploy API to EC2

on:
  push:
    branches: [ "develop" ]
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "Dockerfile"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "056445322590"
  ECR_REPO: ecozone-alpha-api
  IMAGE_TAG: ${{ github.sha }}
  SSM_TARGETS: |
    [{"Key":"tag:App","Values":["ecozone-alpha-api"]}]

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read

    steps:
        
      # ────────────────────────
      # 1️.  코드 체크아웃
      # ────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        
          submodules: recursive    

    # ────────────────────────
    #   리포 구조 확인 (디버그)
    # ────────────────────────
      - name: Show repo tree
        run: |
          pwd
          git rev-parse --short HEAD || true
          ls -la
          find . -maxdepth 2 -type d

      # ────────────────────────
      # 2️.  Docker 빌드 환경 준비
      # ────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ────────────────────────
      # 3️.  AWS 자격 증명 설정 (OIDC AssumeRole)
      # ────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-action-deploy
          aws-region: ${{ env.AWS_REGION }}

      # ────────────────────────
      # 4️.  ECR 로그인
      # ────────────────────────
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      # ────────────────────────
      # 5. ECR 리포지토리 없으면 생성
      # ────────────────────────
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPO --region $AWS_REGION || \
          aws ecr create-repository --repository-name $ECR_REPO --region $AWS_REGION

      # ────────────────────────
      # 6.  Docker 이미지 빌드 & ECR 푸시
      # ────────────────────────
      - name: Build & Push image
        run: |
          REPO="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"
          docker build -t "${REPO}:${IMAGE_TAG}" -t "${REPO}:latest" .
          docker push "${REPO}:${IMAGE_TAG}"
          docker push "${REPO}:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read

    steps:
      # ────────────────────────
      # 6️.  AWS 자격 증명 설정 (OIDC AssumeRole)
      # ────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-action-deploy
          aws-region: ${{ env.AWS_REGION }}

      # ────────────────────────
      # 7.  테스트로 인스턴스 ID로 직접 보내기
      # ────────────────────────
      - name : send Test to Instance ID
        run: |
          aws ssm send-command \
          --region ap-northeast-2 \
          --document-name "AWS-RunShellScript" \
          --instance-ids i-02e6ebdf2218be79b \
          --parameters commands='["echo hello from ssm","uname -a"]'

      # ────────────────────────
      # 8.  EC2 대상에 SSM 명령 전송 
      # ────────────────────────
      - name: Send deploy command via SSM (bootstrap + compose)
        id: ssm
        run: |
          set -e
          ACCOUNT="${AWS_ACCOUNT_ID}"
          REGION="${AWS_REGION}"
          REPO="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${ECR_REPO}"
          TAG="${IMAGE_TAG}"

          # application.yml 을 Secrets로 주입(없으면 빈 파일)
          if [ -n "${{ secrets.APPLICATION_YML }}" ]; then
            APP_CONF=$(echo "${{ secrets.APPLICATION_YML }}" | base64 -w 0)
          else
            APP_CONF="$(echo "" | base64 -w 0)"
          fi

          aws ssm send-command \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --instance-ids i-02e6ebdf2218be79b \
            --parameters commands='[
              "set -euxo pipefail",

              # 1) Docker/compose 설치 및 데몬 기동(snap 또는 apt 둘 다 대응)
              "if ! command -v docker >/dev/null 2>&1; then apt-get update -y && apt-get install -y docker.io docker-compose-plugin; fi",
              "if systemctl list-units --type=service | grep -q ''docker.service''; then systemctl enable --now docker; else snap start --enable docker || true; fi",

              # 2) ECR 로그인
              "aws ecr get-login-password --region '"$REGION"' | docker login --username AWS --password-stdin '"${REPO%/*}"'",

              # 3) 작업 디렉터리/파일 준비
              "mkdir -p /srv/app && cd /srv/app",

              # compose.yml 없으면 생성 (호스트 80 → 컨테이너 8080)
              "test -f compose.yml || cat > compose.yml <<\"YAML\"",
              "services:",
              "  api:",
              "    image: '"$REPO:$TAG"'",   # ← 리터럴로 박아넣기(SSM 셸 변수 의존 X)",
              "    container_name: ecozone-api",
              "    restart: always",
              "    ports:",
              "      - \"80:8080\"",
              "    environment:",
              "      - SPRING_CONFIG_LOCATION=file:/app/config/application.yml",
              "    volumes:",
              "      - /srv/app/application.yml:/app/config/application.yml:ro",
              "YAML",

              # application.yml 주입(Secrets 없으면 빈 파일)
              "echo '"$APP_CONF"' | base64 -d > /srv/app/application.yml",

              # 4) 배포
              "docker compose -f compose.yml pull",
              "docker compose -f compose.yml up -d",

              # 5) 상태 출력
              "docker ps",
              "docker compose -f compose.yml ps"
            ]' \
            --timeout-seconds 1800 \
            --output json > ssm.json

          cat ssm.json
          echo "command_id=$(jq -r '.Command.CommandId' ssm.json)" >> $GITHUB_OUTPUT

      # ────────────────────────
      # 9.  SSM 실행 로그 가져오기(성공/실패 확인)
      # ────────────────────────
      - name: Fetch SSM execution logs
        run: |
          CMD_ID="${{ steps.ssm.outputs.command_id }}"
          aws ssm list-command-invocations \
            --region ${{ env.AWS_REGION }} \
            --command-id "$CMD_ID" \
            --details \
            --query 'CommandInvocations[0].CommandPlugins[].{Name:Name,Status:Status,Output:Output}'

