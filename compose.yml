version: "3.8"

networks:
  oznetwork:
    driver: bridge

services:
  redis:
    image: redis:alpine
    container_name: eco-redis
    command: ["redis-server", "--appendonly", "yes"]   
    ports:
      - "6379:6379"                                  
    volumes:
      - ./redis-data:/data                            
    labels:
      org.springframework.boot.service-connection: "redis" 
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - oznetwork

  redisinsight:
    image: redis/redisinsight:latest
    container_name: eco-redisinsight
    ports:
      - "5540:5540"           # UI: http://localhost:5540
    volumes:
      - ./redisinsight-data:/data  
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - oznetwork

  api:
    image: "${IMAGE}:${IMAGE_TAG}"  
    container_name: ecozone-alpha-api
    restart: always
    ports:
      - "8080:8080"

